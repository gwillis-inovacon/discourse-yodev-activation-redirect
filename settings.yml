homepage_url:
  type: string
  default: ""
  description:
    en: "FALLBACK destination — used only when the per-signup user field below is empty or not exposed. Full URL of the yoDEV homepage app (NOT the Discourse host) where users should be sent after email activation. The component appends /?activated=1 so the homepage's App.tsx handler can detect the post-activation arrival and auto-start OIDC. Recommended PRIMARY source is the per-signup user field — leave this blank if every signup sets that field."

homepage_redirect_field_id:
  type: integer
  default: 0
  min: 0
  max: 1000
  description:
    en: "PRIMARY source — numeric ID of the Discourse User Field that stores the per-signup homepage URL (set by the homepage app at signup time). The component reads /session/current.json after activation, looks up current_user.custom_fields.user_field_<this-id>, and redirects there. If unset (0) or the user has no value for the field, falls back to the homepage_url setting above. Required for multi-environment Discourse instances (one Discourse, multiple homepage URLs)."

redirect_delay_ms:
  type: integer
  default: 0
  min: 0
  max: 10000
  description:
    en: "Milliseconds to wait after the activation success page renders before redirecting to the homepage. Default is 0 (redirect immediately) — Discourse's welcome page has its own auto-redirect to /, and any non-zero delay risks losing the race. Set higher only if you specifically want users to see the welcome message before redirect (and accept that some users will end up on the Discourse home instead)."

watch_timeout_ms:
  type: integer
  default: 60000
  min: 1000
  max: 300000
  description:
    en: "Maximum time to poll for the post-activation welcome state (#welcome-button) before giving up. Polling starts when the user lands on /u/activate-account/<token>; the user has to actually click 'Activate Account' first, which takes some time. Default 60s. If the user takes longer than this to click, polling stops — but they'll still land back here on the welcome page after they do click, and the script restarts then. Increase if your users tend to leave the activation tab open before clicking."
