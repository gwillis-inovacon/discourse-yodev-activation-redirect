homepage_url:
  type: string
  default: ""
  description:
    en: "Destination — full URL of the yoDEV homepage app (NOT the Discourse host) where homepage-originated signups are sent after email activation. The component appends /?activated=1 so the homepage's App.tsx handler can detect the post-activation arrival and auto-start OIDC. Leave blank to disable the redirect entirely."

homepage_signup_group:
  type: string
  default: "homepage_signup"
  description:
    en: "Name of the Discourse group the homepage app adds its own signups to. ONLY members of this group are redirected after activation — everyone else stays on the community, which is what a direct community signup asked for. The group must be visible to its members (visibility_level 2) or /session/current.json will not report it and no one will ever be redirected. Leave blank to redirect every activation regardless of origin (the pre-YOD-497 behaviour; not recommended)."

redirect_delay_ms:
  type: integer
  default: 0
  min: 0
  max: 10000
  description:
    en: "Milliseconds to wait after the activation success page renders before redirecting to the homepage. Default is 0 (redirect immediately) — Discourse's welcome page has its own auto-redirect to /, and any non-zero delay risks losing the race. Set higher only if you specifically want users to see the welcome message before redirect (and accept that some users will end up on the Discourse home instead)."

watch_timeout_ms:
  type: integer
  default: 60000
  min: 1000
  max: 300000
  description:
    en: "Maximum time to poll for the post-activation welcome state (#welcome-button) before giving up. Polling starts when the user lands on /u/activate-account/<token>; the user has to actually click 'Activate Account' first, which takes some time. Default 60s. If the user takes longer than this to click, polling stops — but they'll still land back here on the welcome page after they do click, and the script restarts then. Increase if your users tend to leave the activation tab open before clicking."
