<script>
  (function () {
    // yoDEV Activation Redirect — localStorage handoff variant.
    //
    // On Greg's Discourse v2026.5 setup, clicking "Activate Account" navigates
    // straight to / without rendering a separate /u/activate-account welcome
    // page. So polling for #welcome-button never finds anything. Instead:
    //
    //   1. On the pre-activation page, hook the form/button click and set a
    //      localStorage flag with a timestamp.
    //   2. On the next page the user lands on (typically / after activation),
    //      check the flag, and if it's recent, redirect to the homepage.
    //
    // The flag expires after 5 minutes so a forgotten flag doesn't bounce
    // users on later visits. Settings come from CSS custom properties
    // populated by common.scss (via SCSS interpolation).

    console.log(
      "[yoDEV-activation-redirect] script loaded on " + window.location.pathname
    );

    var FLAG_KEY = "yodev_activation_pending";
    var FLAG_MAX_AGE_MS = 5 * 60 * 1000; // 5 minutes

    function readCssVarString(name) {
      var v = (
        getComputedStyle(document.documentElement).getPropertyValue(name) || ""
      ).trim();
      return v.replace(/^["']|["']$/g, "");
    }

    function readCssVarInt(name, defaultValue) {
      var v = (
        getComputedStyle(document.documentElement).getPropertyValue(name) || ""
      ).trim();
      var n = parseInt(v, 10);
      return isNaN(n) ? defaultValue : n;
    }

    function readSettings() {
      return {
        homepageUrl: readCssVarString("--yodev-activation-redirect-homepage-url"),
        redirectFieldId: readCssVarInt(
          "--yodev-activation-redirect-field-id",
          0
        ),
        redirectDelayMs: readCssVarInt(
          "--yodev-activation-redirect-delay-ms",
          0
        ),
      };
    }

    // Hosts a per-signup value may point at. Anything else is discarded.
    var ALLOWED_HOST = "yodev.dev";

    function isAllowedHost(hostname) {
      var h = (hostname || "").toLowerCase();
      return h === ALLOWED_HOST || h.endsWith("." + ALLOWED_HOST);
    }

    /**
     * Validate and normalise a redirect target (YOD-489).
     *
     * `homepageUrl` may come from user_field_5, which the USER WRITES AT SIGNUP
     * — Discourse renders user fields on the signup form, and `editable: false`
     * only freezes them afterwards. So this value is untrusted input that ends
     * up in window.location.href.
     *
     * Two things this stops, neither of which the old trailing-slash trim did:
     *
     *   javascript: — assigning `javascript:…` to window.location EXECUTES it,
     *   on the community origin, which is where the Discourse session that
     *   drives SSO into worX and Workplace lives. Appending "/?activated=1"
     *   does not neutralise it: a trailing `//` in the payload comments the
     *   suffix out.
     *
     *   any other host — otherwise activation is a redirect to wherever the
     *   signup form was told to send it.
     *
     * `trusted` is set for the admin-configured global setting: it still must
     * be https, but it is not restricted to our own hosts, so the site can be
     * pointed elsewhere deliberately without editing this file.
     *
     * Returns null when the value is unusable; the caller then falls back or
     * declines to redirect, rather than navigating somewhere unexpected.
     */
    function buildTargetUrl(homepageUrl, trusted) {
      if (!homepageUrl) return null;

      var url;
      try {
        url = new URL(homepageUrl);
      } catch (err) {
        // Not absolute, or not parseable — includes "javascript:alert(1)" with
        // no host, and any relative path.
        console.warn("[yoDEV-activation-redirect] unparseable redirect target; ignoring");
        return null;
      }

      if (url.protocol !== "https:") {
        console.warn(
          "[yoDEV-activation-redirect] refusing non-https redirect target (" + url.protocol + ")"
        );
        return null;
      }

      if (!trusted && !isAllowedHost(url.hostname)) {
        console.warn(
          "[yoDEV-activation-redirect] refusing off-site redirect target (" + url.hostname + ")"
        );
        return null;
      }

      // Rebuild from the parsed URL rather than the raw string, so nothing the
      // parser normalised away can survive into the assignment.
      return url.origin + url.pathname.replace(/\/+$/, "") + "/?activated=1";
    }

    function performRedirect(targetUrl, delayMs) {
      console.log(
        "[yoDEV-activation-redirect] redirecting to " +
          targetUrl +
          (delayMs > 0 ? " in " + delayMs + "ms" : " immediately")
      );
      if (delayMs > 0) {
        window.setTimeout(function () {
          window.location.href = targetUrl;
        }, delayMs);
      } else {
        window.location.href = targetUrl;
      }
    }

    // Fetch the current user's per-signup redirect URL from a Discourse User
    // Field. The field's numeric ID must be configured in theme settings AND
    // the field's name (`user_field_<id>`) must be in Discourse's
    // `public_user_custom_fields` site setting so that `/session/current.json`
    // returns it. If fieldId is 0 or the lookup fails, callback(null) and the
    // caller falls back to the global `homepage_url` setting.
    function fetchPerUserRedirectUrl(fieldId, callback) {
      if (!fieldId) {
        callback(null);
        return;
      }
      fetch("/session/current.json", { credentials: "same-origin" })
        .then(function (res) {
          if (!res.ok) {
            console.log(
              "[yoDEV-activation-redirect] /session/current.json status " +
                res.status +
                " — falling back to global setting"
            );
            return null;
          }
          return res.json();
        })
        .then(function (data) {
          if (!data) {
            callback(null);
            return;
          }
          var key = "user_field_" + fieldId;
          var url =
            data.current_user &&
            data.current_user.custom_fields &&
            data.current_user.custom_fields[key];
          callback(url || null);
        })
        .catch(function (e) {
          console.warn(
            "[yoDEV-activation-redirect] error fetching current user:",
            e
          );
          callback(null);
        });
    }

    function checkPendingFlag() {
      var raw = null;
      try {
        raw = localStorage.getItem(FLAG_KEY);
      } catch (e) {
        return; // localStorage unavailable
      }
      if (!raw) return;

      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        try {
          localStorage.removeItem(FLAG_KEY);
        } catch (e2) {}
        return;
      }

      // Always consume the flag — whether we honor it or not, we don't want
      // it sticking around for an unrelated future visit.
      try {
        localStorage.removeItem(FLAG_KEY);
      } catch (e) {}

      var age = Date.now() - (data.timestamp || 0);
      if (age > FLAG_MAX_AGE_MS) {
        console.log(
          "[yoDEV-activation-redirect] activation flag expired (" +
            age +
            "ms old); ignoring"
        );
        return;
      }

      var s = readSettings();
      console.log(
        "[yoDEV-activation-redirect] activation flag detected (" +
          age +
          "ms old); resolving target URL — settings:",
        s
      );

      // Per-signup field is primary; global homepage_url is fallback.
      //
      // A per-signup value that fails validation falls THROUGH to the global
      // setting rather than aborting (YOD-489). A user who typed rubbish into
      // the signup form — or a bot that filled every field — should still land
      // somewhere sensible; only the bad value is discarded, not the redirect.
      fetchPerUserRedirectUrl(s.redirectFieldId, function (perUserUrl) {
        var targetUrl = null;

        if (perUserUrl) {
          // Untrusted: written by the user at signup.
          targetUrl = buildTargetUrl(perUserUrl, false);
          if (targetUrl) {
            console.log(
              "[yoDEV-activation-redirect] using per-signup user field value: " + perUserUrl
            );
          } else {
            console.warn(
              "[yoDEV-activation-redirect] per-signup value rejected; falling back to global setting"
            );
          }
        }

        if (!targetUrl && s.homepageUrl) {
          // Trusted: admin-configured theme setting.
          targetUrl = buildTargetUrl(s.homepageUrl, true);
          if (targetUrl) {
            console.log(
              "[yoDEV-activation-redirect] using global homepage_url setting: " + s.homepageUrl
            );
          }
        }

        if (!targetUrl) {
          console.warn(
            "[yoDEV-activation-redirect] no usable redirect target; not redirecting"
          );
          return;
        }
        performRedirect(targetUrl, s.redirectDelayMs);
      });
    }

    function setActivationFlag() {
      try {
        localStorage.setItem(
          FLAG_KEY,
          JSON.stringify({ timestamp: Date.now() })
        );
        console.log(
          "[yoDEV-activation-redirect] activation flag set; will redirect on next page load"
        );
      } catch (e) {
        console.warn(
          "[yoDEV-activation-redirect] could not write to localStorage:",
          e
        );
      }
    }

    function attachActivationListener() {
      // Look for the Activate Account button. Discourse renders it as a
      // <button> inside the activate-account section; older versions used
      // a <form>, newer ones may use an Ember-managed click handler with
      // a button.
      var btn = document.querySelector(
        "button.activate-account, " +
          ".activate-account button.btn-primary, " +
          ".activate-account button, " +
          "form.activate-account button[type=submit], " +
          "form[action*='activate-account'] button"
      );
      var form = document.querySelector(
        "form.activate-account, form[action*='activate-account']"
      );

      if (form) {
        form.addEventListener("submit", setActivationFlag, { once: true });
        console.log(
          "[yoDEV-activation-redirect] hooked form submit listener"
        );
        return true;
      }
      if (btn) {
        btn.addEventListener("click", setActivationFlag, { once: true });
        console.log(
          "[yoDEV-activation-redirect] hooked button click listener"
        );
        return true;
      }
      return false;
    }

    function handlePreActivationPage() {
      var path = window.location.pathname || "";
      if (path.indexOf("/u/activate-account/") !== 0) return;
      console.log(
        "[yoDEV-activation-redirect] pre-activation URL detected: " +
          path +
          " — installing click/submit listener"
      );

      // Try immediately, then poll briefly for the button to appear (the form
      // is often rendered after Ember finishes routing).
      if (attachActivationListener()) return;
      var elapsed = 0;
      var pollInterval = 200;
      var maxPollMs = 15000;
      var intervalId = setInterval(function () {
        elapsed += pollInterval;
        if (elapsed >= maxPollMs || attachActivationListener()) {
          if (elapsed >= maxPollMs) {
            console.warn(
              "[yoDEV-activation-redirect] gave up looking for Activate button after " +
                maxPollMs +
                "ms (selector may not match this Discourse version)"
            );
          }
          clearInterval(intervalId);
        }
      }, pollInterval);
    }

    function init() {
      var s = readSettings();
      console.log("[yoDEV-activation-redirect] settings (from CSS vars):", s);

      // First: did we just complete activation and land here? Redirect.
      checkPendingFlag();

      // If still here (no flag, or expired), and we're on the pre-activation
      // page, install the click/submit listener so the next click sets the flag.
      handlePreActivationPage();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
</script>
