<script>
  (function () {
    // yoDEV Activation Redirect — localStorage handoff variant.
    //
    // On Greg's Discourse v2026.5 setup, clicking "Activate Account" navigates
    // straight to / without rendering a separate /u/activate-account welcome
    // page. So polling for #welcome-button never finds anything. Instead:
    //
    //   1. On the pre-activation page, hook the form/button click and set a
    //      localStorage flag with a timestamp.
    //   2. On the next page the user lands on (typically / after activation),
    //      check the flag, and if it's recent, redirect to the homepage.
    //
    // The flag expires after 5 minutes so a forgotten flag doesn't bounce
    // users on later visits. Settings come from CSS custom properties
    // populated by common.scss (via SCSS interpolation).

    console.log(
      "[yoDEV-activation-redirect] script loaded on " + window.location.pathname
    );

    var FLAG_KEY = "yodev_activation_pending";
    var FLAG_MAX_AGE_MS = 5 * 60 * 1000; // 5 minutes

    function readCssVarString(name) {
      var v = (
        getComputedStyle(document.documentElement).getPropertyValue(name) || ""
      ).trim();
      return v.replace(/^["']|["']$/g, "");
    }

    function readCssVarInt(name, defaultValue) {
      var v = (
        getComputedStyle(document.documentElement).getPropertyValue(name) || ""
      ).trim();
      var n = parseInt(v, 10);
      return isNaN(n) ? defaultValue : n;
    }

    function readSettings() {
      return {
        homepageUrl: readCssVarString("--yodev-activation-redirect-homepage-url"),
        signupGroup: readCssVarString("--yodev-activation-redirect-signup-group"),
        redirectDelayMs: readCssVarInt(
          "--yodev-activation-redirect-delay-ms",
          0
        ),
      };
    }

    /**
     * Validate and normalise the redirect target.
     *
     * The target is now only ever the admin-configured theme setting (YOD-497
     * removed the per-signup user field that used to feed this), so the host
     * allowlist YOD-489 needed is gone — an admin may legitimately point the
     * site anywhere. The https check stays: it costs nothing and it still stops
     * a `javascript:` value, which assigning to window.location would EXECUTE on
     * the community origin, where the Discourse session driving SSO into worX
     * and Workplace lives.
     *
     * Returns null when the value is unusable, so the caller declines to
     * redirect rather than navigating somewhere unexpected.
     */
    function buildTargetUrl(homepageUrl) {
      if (!homepageUrl) return null;

      var url;
      try {
        url = new URL(homepageUrl);
      } catch (err) {
        // Not absolute, or not parseable — includes "javascript:alert(1)" with
        // no host, and any relative path.
        console.warn("[yoDEV-activation-redirect] unparseable redirect target; ignoring");
        return null;
      }

      if (url.protocol !== "https:") {
        console.warn(
          "[yoDEV-activation-redirect] refusing non-https redirect target (" + url.protocol + ")"
        );
        return null;
      }

      // Rebuild from the parsed URL rather than the raw string, so nothing the
      // parser normalised away can survive into the assignment.
      return url.origin + url.pathname.replace(/\/+$/, "") + "/?activated=1";
    }

    function performRedirect(targetUrl, delayMs) {
      console.log(
        "[yoDEV-activation-redirect] redirecting to " +
          targetUrl +
          (delayMs > 0 ? " in " + delayMs + "ms" : " immediately")
      );
      if (delayMs > 0) {
        window.setTimeout(function () {
          window.location.href = targetUrl;
        }, delayMs);
      } else {
        window.location.href = targetUrl;
      }
    }

    /**
     * Did this account come from the homepage app? YOD-497.
     *
     * The homepage adds every account it creates to a Discourse group; this
     * reads that group back off `/session/current.json`. Accounts without it
     * signed up on the community directly and must NOT be pulled away to a plan
     * chooser — that is the whole defect this gate exists to close.
     *
     * A group rather than a user field on purpose. User fields are not on the
     * rendered signup form, but Discourse's public POST /users.json accepts
     * user_fields[N] whatever the form showed, and /site.json enumerates every
     * field id to anonymous callers — so a script can set any of them at
     * registration (YOD-487). A field would let a direct signup declare itself
     * a homepage signup. Group membership is admin-API only. It also survives
     * activating on a different device from the one that signed up, which the
     * localStorage handoff below does not.
     *
     * Calls back false on any failure — a broken read leaves the user on the
     * community, which is the safe direction to fail. Redirecting on a failed
     * check would reinstate the bug for everyone the moment this call breaks.
     *
     * ⚠️ The group must be visible to its own members (visibility_level 2).
     * Discourse omits groups the requester cannot see from current_user.groups,
     * so a too-private group reads as "nobody is a member" and silently
     * disables the redirect for everyone.
     */
    function fetchIsHomepageSignup(groupName, callback) {
      if (!groupName) {
        // Group gating switched off — every activation redirects, the
        // pre-YOD-497 behaviour. Deliberate opt-out, not a default.
        console.log(
          "[yoDEV-activation-redirect] no signup group configured; redirecting regardless of origin"
        );
        callback(true);
        return;
      }
      fetch("/session/current.json", { credentials: "same-origin" })
        .then(function (res) {
          if (!res.ok) {
            console.warn(
              "[yoDEV-activation-redirect] /session/current.json status " +
                res.status +
                " — cannot confirm origin; staying on the community"
            );
            return null;
          }
          return res.json();
        })
        .then(function (data) {
          if (!data) {
            callback(false);
            return;
          }
          var groups =
            (data.current_user && data.current_user.groups) || [];
          var isMember = groups.some(function (g) {
            return g && g.name === groupName;
          });
          console.log(
            "[yoDEV-activation-redirect] groups: [" +
              groups
                .map(function (g) {
                  return g && g.name;
                })
                .join(", ") +
              "] — member of '" +
              groupName +
              "': " +
              isMember
          );
          callback(isMember);
        })
        .catch(function (e) {
          console.warn(
            "[yoDEV-activation-redirect] error fetching current user; staying on the community:",
            e
          );
          callback(false);
        });
    }

    function checkPendingFlag() {
      var raw = null;
      try {
        raw = localStorage.getItem(FLAG_KEY);
      } catch (e) {
        return; // localStorage unavailable
      }
      if (!raw) return;

      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        try {
          localStorage.removeItem(FLAG_KEY);
        } catch (e2) {}
        return;
      }

      // Always consume the flag — whether we honor it or not, we don't want
      // it sticking around for an unrelated future visit.
      try {
        localStorage.removeItem(FLAG_KEY);
      } catch (e) {}

      var age = Date.now() - (data.timestamp || 0);
      if (age > FLAG_MAX_AGE_MS) {
        console.log(
          "[yoDEV-activation-redirect] activation flag expired (" +
            age +
            "ms old); ignoring"
        );
        return;
      }

      var s = readSettings();
      console.log(
        "[yoDEV-activation-redirect] activation flag detected (" +
          age +
          "ms old); resolving target URL — settings:",
        s
      );

      // Only accounts the homepage created get pulled back to it (YOD-497).
      // Everyone else signed up on the community and stays there.
      fetchIsHomepageSignup(s.signupGroup, function (isHomepageSignup) {
        if (!isHomepageSignup) {
          console.log(
            "[yoDEV-activation-redirect] not a homepage signup; staying on the community"
          );
          return;
        }

        var targetUrl = buildTargetUrl(s.homepageUrl);
        if (!targetUrl) {
          console.warn(
            "[yoDEV-activation-redirect] no usable redirect target; not redirecting"
          );
          return;
        }
        performRedirect(targetUrl, s.redirectDelayMs);
      });
    }

    function setActivationFlag() {
      try {
        localStorage.setItem(
          FLAG_KEY,
          JSON.stringify({ timestamp: Date.now() })
        );
        console.log(
          "[yoDEV-activation-redirect] activation flag set; will redirect on next page load"
        );
      } catch (e) {
        console.warn(
          "[yoDEV-activation-redirect] could not write to localStorage:",
          e
        );
      }
    }

    function attachActivationListener() {
      // Look for the Activate Account button. Discourse renders it as a
      // <button> inside the activate-account section; older versions used
      // a <form>, newer ones may use an Ember-managed click handler with
      // a button.
      var btn = document.querySelector(
        "button.activate-account, " +
          ".activate-account button.btn-primary, " +
          ".activate-account button, " +
          "form.activate-account button[type=submit], " +
          "form[action*='activate-account'] button"
      );
      var form = document.querySelector(
        "form.activate-account, form[action*='activate-account']"
      );

      if (form) {
        form.addEventListener("submit", setActivationFlag, { once: true });
        console.log(
          "[yoDEV-activation-redirect] hooked form submit listener"
        );
        return true;
      }
      if (btn) {
        btn.addEventListener("click", setActivationFlag, { once: true });
        console.log(
          "[yoDEV-activation-redirect] hooked button click listener"
        );
        return true;
      }
      return false;
    }

    function handlePreActivationPage() {
      var path = window.location.pathname || "";
      if (path.indexOf("/u/activate-account/") !== 0) return;
      console.log(
        "[yoDEV-activation-redirect] pre-activation URL detected: " +
          path +
          " — installing click/submit listener"
      );

      // Try immediately, then poll briefly for the button to appear (the form
      // is often rendered after Ember finishes routing).
      if (attachActivationListener()) return;
      var elapsed = 0;
      var pollInterval = 200;
      var maxPollMs = 15000;
      var intervalId = setInterval(function () {
        elapsed += pollInterval;
        if (elapsed >= maxPollMs || attachActivationListener()) {
          if (elapsed >= maxPollMs) {
            console.warn(
              "[yoDEV-activation-redirect] gave up looking for Activate button after " +
                maxPollMs +
                "ms (selector may not match this Discourse version)"
            );
          }
          clearInterval(intervalId);
        }
      }, pollInterval);
    }

    function init() {
      var s = readSettings();
      console.log("[yoDEV-activation-redirect] settings (from CSS vars):", s);

      // First: did we just complete activation and land here? Redirect.
      checkPendingFlag();

      // If still here (no flag, or expired), and we're on the pre-activation
      // page, install the click/submit listener so the next click sets the flag.
      handlePreActivationPage();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
</script>
